[workspace]
resolver = "2"
members = [
    "ops",            # Tensor operations
    "io",             # GGUF parser
    "tokenizer",      # Tokenizer/detokenizer
    "core",           # LLM inference
    "common",         # Common utilities
    "examples/cli",   # CLI tool
    "examples/server", # Web server
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Wang Chunye <wcy123@github>"]
license = "MIT"
repository = "https://github.com/wcy123/hanren"

[workspace.dependencies]
# Internal crates
ops = { path = "ops" }
hanren-io = { path = "io" }
hanren-tokenizer = { path = "tokenizer" }
hanren-core = { path = "core" }
hanren-common = { path = "common" }

# External dependencies
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1
